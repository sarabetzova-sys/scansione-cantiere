<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scansione Cantiere</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; text-align: center; background: #f4f6f9; color: #333; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 400px; margin: 10px auto; }
    h2 { margin-top: 0; color: #1a73e8; font-size: 20px; }
    label { display: block; text-align: left; font-weight: bold; margin: 10px 0 5px; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; }
    .btn { background-color: #1a73e8; color: white; padding: 16px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; width: 100%; cursor: pointer; }
    #reader { width: 100%; margin-top: 15px; border-radius: 10px; overflow: hidden; display: none; background: #000; }
    #status { margin-top: 15px; font-weight: bold; font-size: 15px; min-height: 40px; }
    .success { color: #2e7d32; background: #e8f5e9; padding: 10px; border-radius: 8px; }
    .error { color: #c62828; background: #ffebee; padding: 10px; border-radius: 8px; }
    .loading { color: #f57c00; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📸 Scansione Live Cantiere</h2>
    
    <label for="cantiere">Nome Cantiere:</label>
    <input type="text" id="cantiere" placeholder="Es. Rossi">
    
    <button id="btnStart" class="btn" onclick="avviaFotocamera()">📷 AVVIA FOTOCAMERA</button>
    
    <div id="reader"></div>
    <div id="status"></div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGwTH5XvhmZQ7Dvt5CJv2OkJPr7pqgb8PupsYQA3w7mGZJuuVy7eCQB3MmuJ3p_jqn/exec";

    let html5QrCode;

    function avviaFotocamera() {
      var cantiereVal = document.getElementById('cantiere').value.trim();
      if (!cantiereVal) {
        alert("Inserisci prima il nome del cantiere!");
        return;
      }

      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('reader').style.display = 'block';
      
      var statusDiv = document.getElementById('status');
      statusDiv.className = "loading";
      statusDiv.innerHTML = "Inquadra il codice a barre...";

      html5QrCode = new Html5Qrcode("reader");
      
      const config = { fps: 15, qrbox: { width: 250, height: 150 } };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        statusDiv.className = "error";
        statusDiv.innerHTML = "Errore accesso fotocamera: " + err;
        document.getElementById('btnStart').style.display = 'block';
      });
    }

    function onScanSuccess(decodedText) {
      var statusDiv = document.getElementById('status');
      statusDiv.className = "loading";
      statusDiv.innerHTML = "⏳ Codice letto! Cattura foto in corso...";

      var fotoBase64 = "";
      try {
        var videoElement = document.querySelector("#reader video");
        if (videoElement && videoElement.videoWidth > 0) {
          var canvas = document.createElement("canvas");
          canvas.width = videoElement.videoWidth;
          canvas.height = videoElement.videoHeight;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
          fotoBase64 = canvas.toDataURL("image/jpeg", 0.7);
        }
      } catch(e) {
        console.log("Errore foto:", e);
      }

      html5QrCode.stop().then(() => {
        document.getElementById('reader').style.display = 'none';
        inviaAlServer(decodedText, fotoBase64);
      }).catch(() => {
        document.getElementById('reader').style.display = 'none';
        inviaAlServer(decodedText, fotoBase64);
      });
    }

    function inviaAlServer(seriale, fotoBase64) {
      var cantiereVal = document.getElementById('cantiere').value.trim();
      var statusDiv = document.getElementById('status');
      
      statusDiv.className = "loading";
      statusDiv.innerHTML = "⏳ Salvataggio su Google Drive e Foglio...<br><b>Seriale:</b> " + seriale;

      var payload = {
        cantiere: cantiereVal,
        seriale: seriale,
        fotoBase64: fotoBase64,
        mimeType: "image/jpeg"
      };

      // Utilizzo di mode: 'no-cors' per superare le restrizioni di Safari iOS
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      })
      .then(function() {
        statusDiv.className = "success";
        statusDiv.innerHTML = "✅ Salvato su Drive e Sheet!<br><b>Seriale:</b> " + seriale;
        document.getElementById('btnStart').style.display = 'block';
      })
      .catch(function(err) {
        statusDiv.className = "error";
        statusDiv.innerHTML = "❌ Errore invio dati: " + err;
        document.getElementById('btnStart').style.display = 'block';
      });
    }
  </script>
</body>
</html>
